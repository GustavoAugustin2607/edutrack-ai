name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Valida as especificações
        run: npx -y @fission-ai/openspec@1.16.0 validate --all --strict --no-interactive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa os scripts Python
        run: |
          pip install -r scripts/requirements.txt
          python -m unittest discover scripts -v
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
